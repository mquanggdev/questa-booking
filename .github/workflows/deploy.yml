name: Deploy

# The online demo (phase 9): build the three images, push them to GHCR,
# then deploy over SSH. Runs on a version tag (after review, like every
# phase) or by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/mquanggdev

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API (and worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/questa-booking-api:${{ github.sha }}
            ${{ env.REGISTRY }}/questa-booking-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          tags: |
            ${{ env.REGISTRY }}/questa-booking-migrate:${{ github.sha }}
            ${{ env.REGISTRY }}/questa-booking-migrate:latest
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/questa-booking-web:${{ github.sha }}
            ${{ env.REGISTRY }}/questa-booking-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to the VPS
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
      PORT: ${{ secrets.VPS_PORT || '22' }}
      DIR: questa-booking
    steps:
      - uses: actions/checkout@v4
      # The server's host key is pinned (VPS_KNOWN_HOSTS), not trusted on
      # first use: a man in the middle cannot pose as the VPS.
      - name: SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
      - name: Copy the stack definition
        run: |
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$TARGET" "mkdir -p $DIR/deploy $DIR/docker"
          scp -i ~/.ssh/id_deploy -P "$PORT" docker-compose.prod.yml "$TARGET:$DIR/"
          scp -i ~/.ssh/id_deploy -P "$PORT" deploy/deploy.sh deploy/install-env.sh "$TARGET:$DIR/deploy/"
          scp -i ~/.ssh/id_deploy -P "$PORT" -r docker/nginx docker/prometheus docker/grafana "$TARGET:$DIR/docker/"
      # The server's .env comes from this environment's secrets and
      # variables on every deploy: change a value in GitHub, run Deploy.
      # GitHub masks secret values in the log; the file never is printed.
      - name: Write the server's .env
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          FAKE_PAYMENT_SECRET: ${{ secrets.FAKE_PAYMENT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          DEMO_ORGANIZER_PASSWORD: ${{ secrets.DEMO_ORGANIZER_PASSWORD }}
          VNPAY_TMN_CODE: ${{ secrets.VNPAY_TMN_CODE }}
          VNPAY_HASH_SECRET: ${{ secrets.VNPAY_HASH_SECRET }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_URL }}
          GRAFANA_ROOT_URL: ${{ vars.GRAFANA_URL }}
          EDGE_NETWORK: ${{ vars.EDGE_NETWORK || 'edge' }}
          DEMO_ORGANIZER_EMAIL: ${{ vars.DEMO_ORGANIZER_EMAIL || 'demo@questa.test' }}
          PAYMENT_PROVIDER: ${{ vars.PAYMENT_PROVIDER || 'fake' }}
        run: |
          required="POSTGRES_PASSWORD JWT_ACCESS_SECRET FAKE_PAYMENT_SECRET GRAFANA_ADMIN_PASSWORD PUBLIC_BASE_URL GRAFANA_ROOT_URL"
          optional="DEMO_ORGANIZER_PASSWORD VNPAY_TMN_CODE VNPAY_HASH_SECRET"
          for name in $required; do
            [ -n "${!name}" ] || { echo "::error::$name is not set in the production environment"; exit 1; }
          done
          umask 077
          file="$RUNNER_TEMP/server.env"
          : > "$file"
          # Values pasted in the browser may carry a CR or a newline.
          for name in $required $optional EDGE_NETWORK DEMO_ORGANIZER_EMAIL PAYMENT_PROVIDER; do
            printf '%s=%s\n' "$name" "$(printf '%s' "${!name}" | tr -d '\r\n')" >> "$file"
          done
          scp -i ~/.ssh/id_deploy -P "$PORT" "$file" "$TARGET:$DIR/.env.new"
          rm -f "$file"
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$TARGET" "sh $DIR/deploy/install-env.sh"
      - name: Deploy
        run: ssh -i ~/.ssh/id_deploy -p "$PORT" "$TARGET" "sh $DIR/deploy/deploy.sh ${{ github.sha }}"
      - name: Smoke test over HTTPS
        run: |
          for i in $(seq 1 10); do
            curl -fsS "${{ vars.PUBLIC_URL }}/api/v1/health/ready" && exit 0
            sleep 6
          done
          exit 1
