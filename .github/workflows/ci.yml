name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: questa
          POSTGRES_PASSWORD: questa
          POSTGRES_DB: questa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U questa"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # Phase 8: the outbox/Kafka e2e tests (I7). Same image as compose (the
      # "Kafka paused" test finds the container by it); only the runner
      # talks to it, through localhost:9094.
      kafka:
        image: apache/kafka:4.1.2
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,EXTERNAL://localhost:9094
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
        ports: ['9094:9094']
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"
          --health-interval 10s --health-timeout 10s --health-retries 15 --health-start-period 20s
      mailpit:
        image: axllent/mailpit:v1.27.10
        ports: ['1025:1025', '8025:8025']
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://questa:questa@localhost:5432/questa
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # E2E creates and migrates its own "questa_test" database.
      - run: pnpm test:e2e
      # The committed OpenAPI document and the web's generated types must
      # match the API code; otherwise someone changed the API and forgot to
      # regenerate them.
      - name: OpenAPI document and web types are up to date
        run: |
          pnpm --filter @questa/api openapi:export
          pnpm --filter @questa/web api:types
          git diff --exit-code apps/api/openapi.json apps/web/src/lib/api/schema.d.ts

  browser:
    name: Web — Playwright on the full stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure the stack
        run: |
          cp .env.example .env
          sed -i "s/^JWT_ACCESS_SECRET=.*/JWT_ACCESS_SECRET=ci-$(openssl rand -hex 24)/" .env
          # Browser tests sign in from one IP in bursts (and Playwright
          # retries): rate limiting is proven by the API e2e tests instead.
          sed -i "s/^RATE_LIMIT_ENABLED=.*/RATE_LIMIT_ENABLED=false/" .env
      # `migrate` is a one-off container that exits, so wait for the web
      # container's health check instead of `up --wait`.
      - name: Start the stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q web)")" = healthy ] && exit 0
            sleep 5
          done
          docker compose ps; docker compose logs --tail 100; exit 1
      - run: pnpm --filter @questa/api db:seed
      - run: pnpm --filter @questa/web exec playwright install --with-deps chromium
      - run: pnpm test:browser
        env:
          E2E_BASE_URL: http://localhost:3200
      - if: failure()
        run: docker compose logs api worker web --tail 200
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: false
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
