name: questa

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PORT: 3000
  DATABASE_URL: postgresql://${POSTGRES_USER:-questa}:${POSTGRES_PASSWORD:-questa}@postgres:5432/${POSTGRES_DB:-questa}
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
  HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-600}
  SEAT_HOLD_STRATEGY: ${SEAT_HOLD_STRATEGY:-conditional}
  PAYMENT_GRACE_SECONDS: ${PAYMENT_GRACE_SECONDS:-120}
  RESERVATION_GATE_ENABLED: ${RESERVATION_GATE_ENABLED:-true}
  SWEEP_EVERY_MS: ${SWEEP_EVERY_MS:-60000}
  RECONCILE_EVERY_MS: ${RECONCILE_EVERY_MS:-30000}
  SEAT_BROADCAST_EVERY_MS: ${SEAT_BROADCAST_EVERY_MS:-250}
  WAITING_ROOM_TICK_MS: ${WAITING_ROOM_TICK_MS:-1000}
  WAITING_ROOM_ADMIT_PER_TICK: ${WAITING_ROOM_ADMIT_PER_TICK:-50}
  WAITING_ROOM_PASS_TTL_SECONDS: ${WAITING_ROOM_PASS_TTL_SECONDS:-600}
  CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-60}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_IP_PER_MINUTE: ${RATE_LIMIT_IP_PER_MINUTE:-300}
  RATE_LIMIT_USER_PER_MINUTE: ${RATE_LIMIT_USER_PER_MINUTE:-120}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  DB_TX_MAX_WAIT_MS: ${DB_TX_MAX_WAIT_MS:-2000}
  DB_TX_TIMEOUT_MS: ${DB_TX_TIMEOUT_MS:-10000}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
  ALLOW_FAKE_PAYMENTS: ${ALLOW_FAKE_PAYMENTS:-false}
  FAKE_PAYMENT_SECRET: ${FAKE_PAYMENT_SECRET:-local-fake-gateway-secret}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3200}
  REFUND_MAX_ATTEMPTS: ${REFUND_MAX_ATTEMPTS:-5}
  VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
  VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
  VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  VNPAY_API_URL: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-}
  KAFKA_SEND_TIMEOUT_MS: ${KAFKA_SEND_TIMEOUT_MS:-10000}
  OUTBOX_RELAY_EVERY_MS: ${OUTBOX_RELAY_EVERY_MS:-500}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
  CONSUMER_MAX_ATTEMPTS: ${CONSUMER_MAX_ATTEMPTS:-5}
  SMTP_URL: smtp://mailpit:1025
  METRICS_PORT: 9464
  MAIL_FROM: ${MAIL_FROM:-Questa Booking <tickets@questa.test>}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-questa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-questa}
      POSTGRES_DB: ${POSTGRES_DB:-questa}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g

  redis:
    image: redis:8-alpine
    # AOF on: a Redis restart should not silently drop holds (PostgreSQL still
    # decides correctness, but fewer surprises during load tests).
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  # Event stream (phase 8): one Kafka node in KRaft mode (no ZooKeeper),
  # broker and controller in the same process. Containers use kafka:9092;
  # the host (e2e tests, tools) uses localhost:9094.
  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # One node: internal topics cannot have more than one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by the worker with explicit settings, never by a
      # typo in a topic name.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    ports:
      - '${KAFKA_PORT:-9094}:9094'
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    mem_limit: 768m

  # Local SMTP server with a web inbox (phase 8): ticket emails end up here,
  # never at a real address. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
      - '${SMTP_PORT:-1025}:1025'
    mem_limit: 64m

  # One-off: applies pending migrations, then exits. The API starts only after
  # it succeeds, so a fresh machine gets a ready schema from `docker compose up`.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    working_dir: /repo/apps/api
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment: *api-env
    # Several identical replicas behind Nginx (phase 7a). No host port: they
    # are reached through Nginx, which balances between them.
    deploy:
      replicas: ${API_REPLICAS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/v1/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 512m

  # Background jobs (BullMQ): order expiry, sweep, Redis counter repair;
  # from phase 8 also the outbox relay and the Kafka consumers.
  # Same image as the API, different entry point; no HTTP port.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command: ['node', 'dist/worker.js']
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    mem_limit: 256m

  # The Next.js web app. Browsers only talk to this origin: it serves the
  # pages and forwards /api/* to the API (next.config.ts rewrites).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3000
    environment:
      API_INTERNAL_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/robots.txt']
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 384m

  # The single entry point: pages to `web`, /api and WebSocket to the API
  # replicas (docker/nginx/default.conf). Both host ports reach it, so
  # http://localhost:${WEB_PORT} and http://localhost:${API_PORT}/api keep
  # working as before.
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/proxy-headers.inc:/etc/nginx/conf.d/proxy-headers.inc:ro
    ports:
      - '${WEB_PORT:-3200}:80'
      - '${API_PORT:-3000}:80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/api/v1/health']
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m

  # Monitoring (phase 9), with `--profile monitoring`: Prometheus scrapes
  # the API replicas and the worker; Grafana shows the dashboard
  # (docker/grafana/dashboards/questa.json) at http://localhost:3300.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ['monitoring']
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    mem_limit: 256m

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ['monitoring']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Read-only viewing without an account (the dashboard is the demo).
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/questa.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT:-3300}:3000'
    depends_on:
      - prometheus
    mem_limit: 256m

  # Load generator, only with `--profile loadtest` (see load-tests/run.mjs).
  # Runs inside the compose network and calls the API directly, not through
  # the host port, so Windows/macOS port forwarding does not skew results.
  k6:
    image: grafana/k6:2.3.0
    profiles: ['loadtest']
    environment:
      # Through Nginx, like real traffic: load is spread over the replicas.
      BASE_URL: http://nginx
    volumes:
      - ./load-tests:/load-tests
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  kafkadata:
  promdata:
  grafanadata:
