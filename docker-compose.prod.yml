# The online demo (phase 9): the whole stack on the VPS, from images built by
# CI (ghcr.io), never built on the server. Run by deploy/deploy.sh:
#
#   IMAGE_TAG=<git sha> docker compose -f docker-compose.prod.yml up -d
#
# - Project name "questa-booking": the e-commerce project on the same VPS is
#   called "questa"; sharing the name would make compose stop its containers
#   as orphans (ADR-0014).
# - No host ports. The VPS's Nginx (owned by the e-commerce project, with
#   the TLS certificates) reaches this stack's Nginx and Grafana through the
#   shared Docker network ${EDGE_NETWORK}.
# - Secrets come from .env on the server (never in git): JWT secret,
#   database password, Grafana admin, demo organizer password.
name: questa-booking

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: 3000
  DATABASE_URL: postgresql://questa:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/questa
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  COOKIE_SECURE: 'true'
  SWAGGER_ENABLED: 'true'
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL, e.g. https://booking.example.com}
  # The demo pays at the built-in fake gateway: no real money moves.
  PAYMENT_PROVIDER: fake
  ALLOW_FAKE_PAYMENTS: 'true'
  FAKE_PAYMENT_SECRET: ${FAKE_PAYMENT_SECRET:?set FAKE_PAYMENT_SECRET}
  RATE_LIMIT_ENABLED: 'true'
  KAFKA_BROKERS: kafka:9092
  SMTP_URL: smtp://mailpit:1025
  METRICS_PORT: 9464
  DEMO_ORGANIZER_EMAIL: ${DEMO_ORGANIZER_EMAIL:-demo@questa.test}
  DEMO_ORGANIZER_PASSWORD: ${DEMO_ORGANIZER_PASSWORD:-}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: questa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: questa
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U questa -d questa']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m

  redis:
    image: redis:8-alpine
    # noeviction: BullMQ must never lose a key to memory pressure.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 192m

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      # A small disk and memory footprint: one week of events, 256 MB heap.
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    mem_limit: 640m

  # Ticket emails are caught here, never sent to real inboxes. Not exposed:
  # visitors' email addresses stay private.
  mailpit:
    image: axllent/mailpit:v1.27.10
    restart: unless-stopped
    mem_limit: 64m

  migrate:
    image: ghcr.io/mquanggdev/questa-booking-migrate:${IMAGE_TAG}
    environment:
      DATABASE_URL: postgresql://questa:${POSTGRES_PASSWORD}@postgres:5432/questa
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: ghcr.io/mquanggdev/questa-booking-api:${IMAGE_TAG:?set IMAGE_TAG, the git sha CI built}
    environment: *api-env
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/v1/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 320m

  worker:
    image: ghcr.io/mquanggdev/questa-booking-api:${IMAGE_TAG}
    command: ['node', 'dist/worker.js']
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m

  web:
    image: ghcr.io/mquanggdev/questa-booking-web:${IMAGE_TAG}
    environment:
      API_INTERNAL_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/robots.txt']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m

  # This stack's own load balancer (2 API replicas, WebSocket), same config
  # as locally. The VPS's Nginx forwards the booking domain here.
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/proxy-headers.inc:/etc/nginx/conf.d/proxy-headers.inc:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      default: {}
      edge:
        aliases: [questa-booking-nginx]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/api/v1/health']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 64m

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    restart: unless-stopped
    mem_limit: 256m

  # Public, read-only (anonymous viewer) at the Grafana domain.
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?set GRAFANA_ROOT_URL, e.g. https://grafana.example.com}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/questa.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    networks:
      default: {}
      edge:
        aliases: [questa-booking-grafana]
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 192m

networks:
  # Shared with the VPS's Nginx; deploy/deploy.sh creates it if missing.
  edge:
    name: ${EDGE_NETWORK:?set EDGE_NETWORK, the Docker network of the VPS Nginx}
    external: true

volumes:
  pgdata:
  redisdata:
  kafkadata:
  promdata:
  grafanadata:
