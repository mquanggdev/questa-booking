# Prometheus (phase 9). Scrapes every API replica (found through Docker's
# DNS: one A record per replica of the "api" service) and the worker.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /api/v1/metrics
    dns_sd_configs:
      - names: [api]
        type: A
        port: 3000
        refresh_interval: 10s

  - job_name: worker
    static_configs:
      - targets: ['worker:9464']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
