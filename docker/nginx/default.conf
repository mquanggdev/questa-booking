# The single entry point of the local stack (phase 7a): the browser and k6
# talk to Nginx only.
#   /api/*, /socket.io/*  -> the API replicas (round robin)
#   everything else       -> the Next.js web app
#
# `resolve` (open-source Nginx since 1.27.3) re-reads Docker's DNS, so a
# restarted or re-scaled API replica is picked up without reloading Nginx,
# and Nginx starts even if a name does not resolve yet.
# valid=30s, not shorter: a re-resolve that drops a dead replica while a
# request is still connecting to it leaves a one-server upstream, and Nginx
# then gives up instead of retrying the survivor (`single` peers get no
# retry). The race window is proxy_connect_timeout / valid, about 7 % here;
# the cost is that a newly added replica takes up to 30 s to get traffic.
resolver 127.0.0.11 valid=30s ipv6=off;

upstream api {
    zone api 64k;
    # One DNS name, one A record per replica (deploy.replicas in compose).
    # max_fails=3: a single error (a reset, one slow connect) must not take
    # a healthy replica out; with 2 replicas, two such errors took both out
    # and every request got 502 "no live upstreams" (phase 7b on-sale run).
    # A dead replica still fails 3 quick connects (2 s each) and is skipped.
    server api:3000 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
    # Idle upstream connections are closed by Nginx after 60 s, before the
    # API's keepAliveTimeout (65 s, main.ts): never the other way round.
    keepalive_timeout 60s;
}

upstream web {
    zone web 64k;
    server web:3000 resolve;
    keepalive 16;
}

# WebSocket handshakes send "Connection: upgrade"; plain requests reuse the
# keepalive connection to the upstream.
map $http_upgrade $connection_header {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    client_max_body_size 1m;

    # Prometheus scrapes each replica directly on the Docker network; the
    # metrics are not for the internet (phase 9).
    location = /api/v1/metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header Connection "";
        # A replica that dies mid-request: retry elsewhere only when nothing
        # was sent yet. Non-idempotent requests (POST) are never replayed
        # (proxy_next_upstream's default), so a hold is never sent twice.
        proxy_next_upstream error timeout;
        # A killed container's IP answers nothing (no RST), so a connect
        # would hang for the 60 s default before failing over. Inside the
        # Docker network a healthy connect takes well under a millisecond.
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_header;
        proxy_connect_timeout 2s;
        # Idle WebSocket connections stay open (Socket.IO pings every 25 s).
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header Connection "";
    }
}
