# The single entry point of the local stack (phase 7a): the browser and k6
# talk to Nginx only.
#   /api/*, /socket.io/*  -> the API replicas (round robin)
#   everything else       -> the Next.js web app
#
# `resolve` (open-source Nginx since 1.27.3) re-reads Docker's DNS, so a
# restarted or re-scaled API replica is picked up without reloading Nginx,
# and Nginx starts even if a name does not resolve yet.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api {
    zone api 64k;
    # One DNS name, one A record per replica (deploy.replicas in compose).
    server api:3000 resolve max_fails=1 fail_timeout=5s;
    keepalive 64;
}

upstream web {
    zone web 64k;
    server web:3000 resolve;
    keepalive 16;
}

# WebSocket handshakes send "Connection: upgrade"; plain requests reuse the
# keepalive connection to the upstream.
map $http_upgrade $connection_header {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header Connection "";
        # A replica that dies mid-request: retry elsewhere only when nothing
        # was sent yet. Non-idempotent requests (POST) are never replayed
        # (proxy_next_upstream's default), so a hold is never sent twice.
        proxy_next_upstream error timeout;
        proxy_read_timeout 30s;
    }

    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_header;
        # Idle WebSocket connections stay open (Socket.IO pings every 25 s).
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header Connection "";
    }
}
